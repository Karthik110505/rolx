<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="#" onclick="loadSection('buy')">Buy</a></li>
            <li><a href="#" onclick="loadSection('sell')">Sell</a></li>
            <li><a href="#" onclick="loadSection('cart')">Cart</a></li>
            <li><a href="#" onclick="loadProfile()">Profile</a></li>
        </ul>
    </nav>

    <div id="content">
        <h2>Welcome to the Dashboard</h2>
        <p>Select an option from the menu.</p>
    </div>

    <script>
        function loadSection(section) {
            const content = document.getElementById("content");

            if (section === "buy") {
                content.innerHTML = `
                    <h2>Buy Items</h2>
                    <p>All items available for purchase will be displayed here.</p>
                `;
            } else if (section === "sell") {
                content.innerHTML = `
                    <h2>Sell Items</h2>
                    <p>Your sold products:</p>
                    <div id="sold-items"></div>
                    <button onclick="showSellForm()">Sell an Item</button>
                    <div id="sell-form" style="display:none;">
                        <h3>Sell a New Item</h3>
                        <form id="sellProductForm" enctype="multipart/form-data">
                            <label>Product Name:</label>
                            <input type="text" id="product_name" required><br>
                            <label>Description:</label>
                            <textarea id="description" required></textarea><br>
                            <label>Image:</label>
                            <input type="file" id="product_image" accept="image/*" required><br>
                            <button type="submit">Submit</button>
                        </form>
                    </div>
                `;

                fetch("../backend/get_sold_products.php")
                    .then(response => response.json())
                    .then(products => {
                        let productList = "<ul>";
                        products.forEach(product => {
                            productList += `
                                <li>
                                    <h3>${product.product_name}</h3>
                                    <p>${product.description}</p>
                                    <img src="../backend/${product.product_image}" width="100">
                                    <p>Contact: ${product.owner_phone}</p>
                                </li>
                            `;
                        });
                        productList += "</ul>";
                        document.getElementById("sold-items").innerHTML = productList;
                    });

                setTimeout(attachSellFormListener, 500);
            }
        }

        function showSellForm() {
            document.getElementById("sell-form").style.display = "block";
        }

        function attachSellFormListener() {
            const form = document.getElementById("sellProductForm");
            form.addEventListener("submit", function (e) {
                e.preventDefault();

                let productName = document.getElementById("product_name").value.trim();
                let description = document.getElementById("description").value.trim();
                let imageInput = document.getElementById("product_image").files[0];

                if (!productName || !description || !imageInput) {
                    alert("Please fill in all fields and select an image.");
                    return;
                }

                let formData = new FormData();
                formData.append("product_name", productName);
                formData.append("description", description);
                formData.append("product_image", imageInput);

                fetch("../backend/add_product.php", {
                    method: "POST",
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert("Product added successfully!");
                        loadSection("sell");
                    } else {
                        alert("Error: " + data.error);
                    }
                });
            });
        }
        function loadProfile() {
            fetch("../backend/profile.php")
                .then(response => response.json())
                .then(user => {
                    if (user.error) {
                        document.getElementById("content").innerHTML = `<p>Error: ${user.error}</p>`;
                        return;
                    }

                    document.getElementById("content").innerHTML = `
                        <h2>Profile</h2>
                        <div id="profile-details">
                            <h3>Welcome, ${user.full_name} (${user.username})</h3>
                            <img src="../backend/uploads/${user.profile_picture}" alt="Profile Picture" width="100" height="100">
                            <p><strong>Email:</strong> ${user.email}</p>
                            <p><strong>Phone:</strong> ${user.phone}</p>
                            <p><strong>Department:</strong> ${user.department}</p>
                            <p><strong>Year of Study:</strong> ${user.year_of_study}</p>
                        </div>
                        <button onclick="logout()">Logout</button>
                    `;
                })
                .catch(error => {
                    console.error("Error fetching profile:", error);
                    document.getElementById("content").innerHTML = "<p>Error loading profile.</p>";
                });
        }

        function logout() {
            fetch("../backend/logout.php")
                .then(() => {
                    window.location.href = "login.html";
                })
                .catch(error => console.error("Logout failed:", error));
        }
    </script>
</body>
</html>
