<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">MyShop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#" onclick="loadSection('buy')">Buy</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="loadSection('sell')">Sell</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="loadSection('cart')">Cart</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="loadProfile()">Profile</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div id="content" class="text-center">
            <h2>Welcome to the Dashboard</h2>
            <p>Select an option from the menu.</p>
        </div>
    </div>

    <script>
        function loadSection(section) {
            const content = document.getElementById("content");

            if (section === "buy") {
                content.innerHTML = `
                    <h2 class="text-center">Available Products</h2>
                    <div id="product-list" class="row justify-content-center">Loading...</div>
                `;

                fetch("../backend/get_products.php")
                    .then(response => response.json())
                    .then(products => {
                        if (products.error) {
                            document.getElementById("product-list").innerHTML = `<p>Error: ${products.error}</p>`;
                            return;
                        }

                        let productList = "";
                        products.forEach(product => {
                            productList += `
                                <div class="col-lg-2 col-md-3 col-sm-4 col-6 mb-3 d-flex">
                                    <div class="card shadow-sm h-100 product-card d-flex flex-column">
                                        <div class="image-container">
                                            <img src="../backend/${product.product_image}" class="card-img-top" alt="${product.product_name}">
                                        </div>
                                        <div class="card-body d-flex flex-column flex-grow-1">
                                            <h6 class="card-title">${product.product_name}</h6>
                                            <p class="card-text flex-grow-1">${product.description}</p>
                                            <p class="card-text"><strong>Owner:</strong> ${product.username}</p>
                                            <p class="card-text"><strong>Phone:</strong> ${product.owner_phone}</p>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });

                        let productListContainer = document.getElementById("product-list");
                        if (productListContainer) {
                            productListContainer.innerHTML = productList;
                        }
                    })
                    .catch(error => {
                        console.error("Error fetching products:", error);
                        document.getElementById("product-list").innerHTML = "<p>Error loading products.</p>";
                    });
            } else if (section === "sell") {
                content.innerHTML = `
                    <h2 class="text-center">Sell Items</h2>
                    <p>Your sold products:</p>
                    <div id="sold-items" class="row"></div>
                    <button class="btn btn-primary mt-3" onclick="showSellForm()">Sell an Item</button>
                    <div id="sell-form" class="mt-3" style="display:none;">
                        <h3>Sell a New Item</h3>
                        <form id="sellProductForm" class="p-3 border rounded shadow-sm bg-light" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label class="form-label">Product Name:</label>
                                <input type="text" id="product_name" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description:</label>
                                <textarea id="description" class="form-control" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Image:</label>
                                <input type="file" id="product_image" class="form-control" accept="image/*" required>
                            </div>
                            <button type="submit" class="btn btn-success">Submit</button>
                        </form>
                    </div>
                `;

                fetch("../backend/get_sold_products.php")
                    .then(response => response.json())
                    .then(products => {
                        let productList = "<div class='row'>";
                        products.forEach(product => {
                            productList += `
                                <div class="col-md-4">
                                    <div class="card shadow-sm">
                                        <img src="../backend/${product.product_image}" class="card-img-top" alt="${product.product_name}">
                                        <div class="card-body">
                                            <h5 class="card-title">${product.product_name}</h5>
                                            <p class="card-text">${product.description}</p>
                                            <p>Contact: ${product.owner_phone}</p>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        productList += "</div>";
                        document.getElementById("sold-items").innerHTML = productList;
                    });

                setTimeout(attachSellFormListener, 500);
            }
        }

        function showSellForm() {
            document.getElementById("sell-form").style.display = "block";
        }

        function attachSellFormListener() {
            const form = document.getElementById("sellProductForm");
            form.addEventListener("submit", function (e) {
                e.preventDefault();

                let productName = document.getElementById("product_name").value.trim();
                let description = document.getElementById("description").value.trim();
                let imageInput = document.getElementById("product_image").files[0];

                if (!productName || !description || !imageInput) {
                    alert("Please fill in all fields and select an image.");
                    return;
                }

                let formData = new FormData();
                formData.append("product_name", productName);
                formData.append("description", description);
                formData.append("product_image", imageInput);

                fetch("../backend/add_product.php", {
                    method: "POST",
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert("Product added successfully!");
                        loadSection("sell");
                    } else {
                        alert("Error: " + data.error);
                    }
                });
            });
        }

        function loadProfile() {
            fetch("../backend/profile.php")
                .then(response => response.json())
                .then(user => {
                    if (user.error) {
                        document.getElementById("content").innerHTML = `<p>Error: ${user.error}</p>`;
                        return;
                    }

                    document.getElementById("content").innerHTML = `
                        <h2 class="text-center">Profile</h2>
                        <div id="profile-details" class="text-center">
                            <h3>Welcome, ${user.full_name} (${user.username})</h3>
                            <img src="../backend/uploads/${user.profile_picture}" class="rounded-circle border shadow-sm" alt="Profile Picture" width="100" height="100">
                            <p><strong>Email:</strong> ${user.email}</p>
                            <p><strong>Phone:</strong> ${user.phone}</p>
                            <p><strong>Department:</strong> ${user.department}</p>
                            <p><strong>Year of Study:</strong> ${user.year_of_study}</p>
                        </div>
                        <button class="btn btn-danger" onclick="logout()">Logout</button>
                    `;
                });
        }

        function logout() {
            fetch("../backend/logout.php").then(() => {
                window.location.href = "login.html";
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
