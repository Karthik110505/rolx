<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">C-OLX</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" id="nav-buy" href="#" onclick="loadSection('buy')">Buy</a></li>
                    <li class="nav-item"><a class="nav-link" id="nav-sell" href="#" onclick="loadSection('sell')">Sell</a></li>
                    <li class="nav-item"><a class="nav-link" id="nav-cart" href="#" onclick="loadSection('cart')">Cart</a></li>
                    <li class="nav-item"><a class="nav-link" id="nav-profile" href="#" onclick="loadProfile()">Profile</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div id="content" class="text-center">
            <h2>Welcome to the Dashboard</h2>
            <p>Select an option from the menu.</p>
        </div>
    </div>

    <script>
        function loadSection(section) {
            const content = document.getElementById("content");

            if (section === "buy") {
    content.innerHTML = `
        <h2 class="text-center">Available Products</h2>
        <div id="product-list" class="row justify-content-center">Loading...</div>
    `;

    fetch("../backend/get_products.php")
        .then(response => response.json())
        .then(products => {
            if (products.error) {
                document.getElementById("product-list").innerHTML = `<p class='text-danger text-center'>Error: ${products.error}</p>`;
                return;
            }

            let productList = "";
            products.forEach(product => {
                productList += `
                    <div class="col-lg-3 col-md-3 col-sm-6 mb-3 d-flex">
                        <div class="card shadow-sm h-100 product-card d-flex flex-column">
                            <div class="image-container">
                                <img src="../backend/${product.product_image}" class="card-img-top" alt="${product.product_name}">
                            </div>
                            <div class="card-body d-flex flex-column flex-grow-1">
                                <h6 class="card-title">${product.product_name}</h6>
                                <p class="card-text flex-grow-1">${product.description}</p>
                                <p class="card-text"><strong>Owner:</strong> ${product.username}</p>
                                <p class="card-text"><strong>Contact:</strong> ${product.owner_phone}</p>
                                <p class="card-text"><strong>Product ID:</strong> ${product.product_id}</p>
                                <p class="card-text"><strong>Owner ID:</strong> ${product.owner_id}</p>
                                <button class="btn btn-primary btn-sm mt-auto" onclick="buyProduct(${product.product_id}, '${product.owner_id}')">
                                    Buy
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            let productListContainer = document.getElementById("product-list");
            if (productListContainer) {
                productListContainer.innerHTML = productList;
            }
        })
        .catch(error => {
            console.error("Error fetching products:", error);
            document.getElementById("product-list").innerHTML = "<p class='text-danger text-center'>Error loading products.</p>";
        });
}
    else if (section === "sell") {
    content.innerHTML = `
        <h2 class="text-center">Sell Items</h2>
        <p class="text-center">Your sold products:</p>
        <div id="sold-items" class="row justify-content-center">Loading...</div>

        <button class="btn btn-primary mt-3 d-block mx-auto" onclick="showSellForm()">Sell an Item</button>
        
        <div id="sell-form" class="mt-3 p-3 border rounded shadow-sm bg-light" style="display:none; max-width: 500px; margin:auto;">
            <h3 class="text-center">Sell a New Item</h3>
            <form id="sellProductForm" class="p-3" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Product Name:</label>
                    <input type="text" id="product_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description:</label>
                    <textarea id="description" class="form-control" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Image:</label>
                    <input type="file" id="product_image" class="form-control" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Submit</button>
            </form>
        </div>
    `;

    fetch("../backend/get_sold_products.php")
        .then(response => response.json())
        .then(products => {
            if (products.length === 0) {
                document.getElementById("sold-items").innerHTML = "<p class='text-center text-muted'>No items sold yet.</p>";
                return;
            }

            let productList = "";
            products.forEach(product => {
                productList += `
                    <div class="col-lg-3 col-md-4 col-sm-6 mb-3 d-flex">
                        <div class="card shadow-sm h-100 product-card d-flex flex-column">
                            <div class="image-container">
                                <img src="../backend/${product.product_image}" class="card-img-top" alt="${product.product_name}">
                            </div>
                            <div class="card-body d-flex flex-column flex-grow-1">
                                <h6 class="card-title">${product.product_name}</h6>
                                <p class="card-text flex-grow-1">${product.description}</p>
                                <p class="card-text"><strong>Product ID:</strong> ${product.product_id}</p>
                                <p class="card-text"><strong>Contact:</strong> ${product.owner_phone}</p>
                `;

                if (product.status === "SOLD") {
                    productList += `<p class="text-success"><strong>Status:</strong> SOLD</p>`;
                } else if (product.status === "PENDING") {
                    productList += `
                        <p class="text-warning"><strong>Pending Buyer:</strong> ${product.buyer_id}</p>
                        <button class="btn btn-success btn-sm mt-2" onclick="confirmSale(${product.cart_id})">
                            Confirm Sale
                        </button>
                        <button class="btn btn-danger btn-sm mt-2" onclick="cancelSale(${product.cart_id})">
                            Cancel
                        </button>
                    `;
                } else {
                    productList += `<p class="text-info"><strong>Status:</strong> Available</p>`;
                }

                productList += `</div></div></div>`;
            });

            document.getElementById("sold-items").innerHTML = productList;
        })
        .catch(error => {
            console.error("Error fetching sold products:", error);
            document.getElementById("sold-items").innerHTML = "<p class='text-center text-danger'>Error loading sold items.</p>";
        });

    setTimeout(attachSellFormListener, 500);
}

            else if (section === "cart") {
                content.innerHTML = `
            <h2 class="text-center">Your Cart</h2>
            <div id="cart-items" class="row justify-content-center">Loading...</div>
        `;
        fetch("../backend/get_cart.php")
    .then(response => response.json())
    .then(data => {
        console.log("Debug Info:", data); // Debugging
        if (data.error) {
            document.getElementById("cart-items").innerHTML = `<p>Error: ${data.error}</p>`;
            return;
        }

        if (!Array.isArray(data)) {
            console.error("Unexpected response format:", data);
            document.getElementById("cart-items").innerHTML = "<p>Invalid data received.</p>";
            return;
        }

        let cartList = "";
        data.forEach(item => {
            cartList += `
                <div class="col-lg-3 col-md-4 col-sm-6 mb-3 d-flex">
                    <div class="card shadow-sm h-100 product-card d-flex flex-column">
                        <div class="image-container">
                            <img src="../backend/${item.product_image}" class="card-img-top" alt="${item.product_name}">
                        </div>
                        <div class="card-body d-flex flex-column flex-grow-1">
                            <h6 class="card-title">${item.product_name}</h6>
                            <p class="card-text flex-grow-1">${item.description}</p>
                            <p class="card-text"><strong>Product ID:</strong> ${item.product_id}</p>
                            <p class="card-text"><strong>Owner ID:</strong> ${item.owner_id}</p>
                            <p class="card-text"><strong>Owner:</strong> ${item.owner_name}</p>
                            <p class="card-text"><strong>Phone:</strong> ${item.owner_phone}</p>
                            <p class="card-text"><strong>Status:</strong> <span class="badge bg-info">${item.status}</span></p>
                            <button class="btn btn-danger mt-2" onclick="removeFromCart(${item.cart_id})">
                                Remove
                            </button>
                        </div>
                    </div>
                </div>
            `;
        });

        document.getElementById("cart-items").innerHTML = cartList;
    })
    .catch(error => {
        console.error("Error fetching cart:", error);
        document.getElementById("cart-items").innerHTML = "<p>Error loading cart.</p>";
    });

}
setActiveSectionById(`nav-${section}`);



    }

        function showSellForm() {
            document.getElementById("sell-form").style.display = "block";
        }

        function attachSellFormListener() {
            const form = document.getElementById("sellProductForm");
            form.addEventListener("submit", function (e) {
                e.preventDefault();

                let productName = document.getElementById("product_name").value.trim();
                let description = document.getElementById("description").value.trim();
                let imageInput = document.getElementById("product_image").files[0];

                if (!productName || !description || !imageInput) {
                    alert("Please fill in all fields and select an image.");
                    return;
                }

                let formData = new FormData();
                formData.append("product_name", productName);
                formData.append("description", description);
                formData.append("product_image", imageInput);

                fetch("../backend/add_product.php", {
                    method: "POST",
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert("Product added successfully!");
                        loadSection("sell");
                    } else {
                        alert("Error: " + data.error);
                    }
                });
            });
        }

        function loadProfile() {
    fetch("../backend/profile.php")
        .then(response => response.json())
        .then(user => {
            document.getElementById("content").innerHTML = `
            <div class="profile-card card mx-auto shadow-lg animate-fade">
        <div class="text-center">
            <img src="../backend/uploads/${user.profile_picture}" alt="Profile Picture">
            <h3 class="mt-3">${user.full_name} <small class="text-muted">(${user.username})</small></h3>
        </div>
        <ul class="profile-details list-group list-group-flush">
            <li class="list-group-item"><strong>Email:</strong> <span>${user.email}</span></li>
            <li class="list-group-item"><strong>Phone:</strong> <span>${user.phone}</span></li>
            <li class="list-group-item"><strong>Department:</strong> <span>${user.department}</span></li>
            <li class="list-group-item"><strong>Year of Study:</strong> <span>${user.year_of_study}</span></li>
        </ul>
        <button class="btn btn-outline-danger logout-btn" onclick="logout()">Logout</button>
    </div>
`;
});
setActiveSectionById("nav-profile");

}

        function logout() {
            fetch("../backend/logout.php").then(() => {
                window.location.href = "login.html";
            });
        }
        function buyProduct(productId, ownerId) {
    console.log("buyProduct called with productId:", productId, "ownerId:", ownerId); // Debugging

    fetch("../backend/add_to_cart.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
            product_id: productId, 
            owner_id: ownerId
        })
    })
    .then(response => response.json())
    .then(data => {
        console.log("Response:", data); // Debugging
        if (data.success) {
            alert("Product added to cart!");
        } else {
            alert("Error: " + data.error);
        }
    })
    .catch(error => {
        console.error("Error:", error); // Debugging
    });
}
 
function removeFromCart(cart_id) {
    fetch('../backend/remove_from_cart.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: `cart_id=${encodeURIComponent(cart_id)}`
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert(data.success);
            loadSection('cart'); // Reload the cart section after removal
        } else {
            alert(data.error || "Failed to remove item.");
        }
    })
    .catch(error => {
        console.error("Remove error:", error);
        alert("An error occurred.");
    });
}

function confirmSale(cartId) {
    fetch('../backend/confirm_sale.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: `cart_id=${cartId}`
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert("Sale confirmed successfully!");
            location.reload(); // Refresh the page to reflect changes
        } else {
            alert("Error: " + data.error);
        }
    })
    .catch(error => console.error("Error:", error));
}


// Function to cancel the sale
function cancelSale(cartId) {
    fetch("../backend/cancel_sale.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cart_id: cartId })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert("Sale canceled!");
            loadSection("sell"); // Refresh sell section
        } else {
            alert("Error: " + data.error);
        }
    })
    .catch(error => console.error("Error:", error));
}

 
    // Load 'Buy' section by default on page load
    document.addEventListener('DOMContentLoaded', () => {
        loadSection('buy');
    });

    function setActiveSectionById(activeId) {
    // Remove 'active' from all links
    document.querySelectorAll(".nav-link").forEach(link => {
        link.classList.remove("active");
    });

    // Add 'active' class to the specific ID
    const activeLink = document.getElementById(activeId);
    if (activeLink) {
        activeLink.classList.add("active");
    }
}


 
 
 </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
